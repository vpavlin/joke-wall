name: Release LGX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-lgx:
    name: Build portable LGX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up Nix cache
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build portable LGX
        working-directory: ui
        run: nix build .#lgx --print-build-logs

      - name: Locate LGX file
        id: lgx
        working-directory: ui
        run: |
          LGX=$(find result/ -name "*.lgx" | head -1)
          echo "path=$LGX" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $LGX)" >> "$GITHUB_OUTPUT"

      - name: Upload LGX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lgx.outputs.name }}
          path: ui/${{ steps.lgx.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/${{ steps.lgx.outputs.path }}
          generate_release_notes: true
